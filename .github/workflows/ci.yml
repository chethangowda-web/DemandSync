name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pds, POSTGRES_PASSWORD: pds, POSTGRES_DB: pds_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pds" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pds:pds@localhost:5432/pds_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests -q
